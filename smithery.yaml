# Smithery configuration for Jurisprudência TJGO
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_tjgo

name: tjgo-mcp
displayName: "Jurisprudência TJGO"
description: >
  Pesquise jurisprudência do TJGO direto do Claude, ChatGPT ou do seu agente. Cada acórdão vem com órgão julgador, relator, data, o trecho que casou a busca e o link no site oficial. O acervo publicado deste tribunal está com defasagem, e a própria resposta avisa isso com a data mais recente que encontrou, para você conferir no site oficial antes de tratar uma decisão como o estado atual. A mesma conexão alcança outros 16 tribunais. Grátis, sem login.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/tjgo-mcp
repository: https://github.com/mcp-dir/tjgo-mcp

tags:
  - tjgo
  - goias
  - jurisprudencia
  - acordaos
  - tribunal-de-justica
  - case-law
  - brazil
  - read-only
  - no-auth
  - free

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_tjgo

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_tjgo/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
